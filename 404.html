<script>
// Shiso's site was at /mise-homepage/ until November 2026, and copies of the app already installed still open its pages
// there. Send any such address to the same page under /shiso/, with its query and fragment. Every other path stays a 404.
(function () {
  var old = /^\/mise-homepage(?=\/|$)/;
  if (old.test(location.pathname)) location.replace(location.pathname.replace(old, "/shiso") + location.search + location.hash);
})();
</script>
